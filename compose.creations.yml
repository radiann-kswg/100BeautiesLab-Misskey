name: creations-detox-dev
services:
  db:
    image: postgres:18-alpine
    env_file: .config/creations-db.env
    ports:
      - "127.0.0.1:65432:5432"
    volumes:
      - creations-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misskey -d misskey"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - creations-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
volumes:
  creations-db:
  creations-redis:
